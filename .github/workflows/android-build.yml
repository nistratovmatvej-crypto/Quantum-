name: Android build and tests

on:
  push:
    branches: [main, alpha-0.1.1-build-repair]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quantum-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Verify wrapper, tests and APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true

      - name: Install Android SDK platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Install Gradle 8.10.2 for wrapper bootstrap
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Generate official Gradle Wrapper
        shell: bash
        run: |
          gradle wrapper --gradle-version 8.10.2 --distribution-type bin
          test -s gradle/wrapper/gradle-wrapper.jar
          grep -q 'gradle-8.10.2-bin.zip' gradle/wrapper/gradle-wrapper.properties

      - name: Verify official wrapper
        run: ./gradlew --version

      - name: Clean project
        run: ./gradlew --no-daemon clean

      - name: Run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Verify APK
        id: apk
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "bytes=$(stat -c%s "$APK")" >> "$GITHUB_OUTPUT"
          sha256sum "$APK"

      - name: Write build report
        env:
          APK_PATH: ${{ steps.apk.outputs.path }}
          APK_BYTES: ${{ steps.apk.outputs.bytes }}
        shell: bash
        run: |
          cat > BUILD_REPORT.md <<EOF
          # Quantum Alpha 0.1.1 — Build report

          **Status: GREEN — Android unit tests and debug APK build passed.**

          - Workflow: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - Commit: ${GITHUB_SHA}
          - Runner: ${RUNNER_OS}
          - Java: Temurin 17
          - Gradle: 8.10.2, official wrapper generated and executed
          - Android SDK: API 35, Build Tools 35.0.0

          ## Executed commands
          - `gradle wrapper --gradle-version 8.10.2 --distribution-type bin` — passed
          - `./gradlew --version` — passed
          - `./gradlew --no-daemon clean` — passed
          - `./gradlew --no-daemon testDebugUnitTest` — passed
          - `./gradlew --no-daemon assembleDebug` — passed
          - APK non-empty check — passed

          ## APK
          - Path: `${APK_PATH}`
          - Size: ${APK_BYTES} bytes
          - SHA-256: recorded in workflow logs.
          - Download artifact: `Quantum-Alpha-0.1.1-debug-apk`

          ## Limitations
          This proves compilation, unit tests and debug APK packaging only. It does not imply that microphone capture, STT, AI, TTS, device actions, overlays or billing are implemented. A real-device installation smoke test remains necessary.
          EOF

      - name: Commit official wrapper and report
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties BUILD_REPORT.md
          if ! git diff --cached --quiet; then
            git commit -m 'Build: add verified Gradle wrapper and Alpha 0.1.1 report'
            git push
          fi

      - name: Upload APK, wrapper and test reports
        uses: actions/upload-artifact@v4
        with:
          name: Quantum-Alpha-0.1.1-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/reports/tests/testDebugUnitTest/
            gradlew
            gradlew.bat
            gradle/wrapper/gradle-wrapper.jar
            gradle/wrapper/gradle-wrapper.properties
            BUILD_REPORT.md
          if-no-files-found: error
          retention-days: 30
