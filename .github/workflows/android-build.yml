name: Android build and tests

on:
  push:
    branches: [main, alpha-0.1.1-build-repair, design/quantum-ios-inspired, alpha-0.2-microphone-onboarding]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quantum-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - name: Install Gradle 8.10.2 for official wrapper bootstrap
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Generate official Gradle Wrapper if missing
        shell: bash
        run: |
          if [ ! -s gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.10.2 --distribution-type bin
          fi
          test -s gradle/wrapper/gradle-wrapper.jar
          grep -q 'gradle-8.10.2-bin.zip' gradle/wrapper/gradle-wrapper.properties
      - name: Commit official wrapper files
        if: github.event_name != 'pull_request'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
          if ! git diff --cached --quiet; then
            git commit -m 'Build: add official Gradle 8.10.2 wrapper'
            git push
          fi
      - name: Verify wrapper version
        run: ./gradlew --version
      - name: Run unit tests
        run: ./gradlew --no-daemon clean testDebugUnitTest
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug
      - name: Verify APK output
        shell: bash
        run: |
          APK='app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          ls -lh "$APK"
          sha256sum "$APK"
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Quantum-Alpha-0.2.0-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
