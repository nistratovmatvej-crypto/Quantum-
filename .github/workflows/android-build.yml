name: Android build and tests

on:
  push:
    branches: [main, alpha-0.1.1-build-repair]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quantum-android-v2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Verify wrapper, tests and APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true

      - name: Install Android SDK platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Install Gradle 8.10.2 for wrapper bootstrap
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Generate official Gradle Wrapper
        shell: bash
        run: |
          gradle wrapper --gradle-version 8.10.2 --distribution-type bin
          test -s gradle/wrapper/gradle-wrapper.jar
          grep -q 'gradle-8.10.2-bin.zip' gradle/wrapper/gradle-wrapper.properties

      - name: Verify official wrapper
        run: ./gradlew --version

      - name: Clean project
        run: ./gradlew --no-daemon clean

      - name: Run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Verify APK
        id: apk
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "bytes=$(stat -c%s "$APK")" >> "$GITHUB_OUTPUT"
          SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          sha256sum "$APK"

      - name: Write build report
        env:
          APK_PATH: ${{ steps.apk.outputs.path }}
          APK_BYTES: ${{ steps.apk.outputs.bytes }}
          APK_SHA256: ${{ steps.apk.outputs.sha256 }}
        shell: bash
        run: |
          cat > BUILD_REPORT.md <<'REPORT'
          # Quantum Alpha 0.1.1 — Build report

          **Status: GREEN — Android unit tests and debug APK build passed.**

          - Workflow: __WORKFLOW_URL__
          - Verified source commit: __COMMIT_SHA__
          - Runner: __RUNNER_OS__
          - Java: Temurin 17
          - Gradle: 8.10.2; official Gradle Wrapper generated, verified and committed
          - Android SDK: API 35, Build Tools 35.0.0

          ## Executed commands
          - \`gradle wrapper --gradle-version 8.10.2 --distribution-type bin\` — passed
          - \`./gradlew --version\` — passed
          - \`./gradlew --no-daemon clean\` — passed
          - \`./gradlew --no-daemon testDebugUnitTest\` — passed
          - \`./gradlew --no-daemon assembleDebug\` — passed
          - APK non-empty check — passed

          ## APK
          - Build output: \`__APK_PATH__\`
          - Size: __APK_BYTES__ bytes
          - SHA-256: \`__APK_SHA256__\`
          - GitHub Actions artifact: \`Quantum-Alpha-0.1.1-debug-apk\`

          ## Scope and limitations
          This verifies compilation, JVM unit tests and debug APK packaging. It does not mean microphone capture, speech recognition, AI, TTS, device actions, system overlays or billing are implemented. Installation and interactive smoke testing on a physical Android device remain outstanding.
          REPORT
          sed -i \
            -e "s|__WORKFLOW_URL__|${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}|g" \
            -e "s|__COMMIT_SHA__|${GITHUB_SHA}|g" \
            -e "s|__RUNNER_OS__|${RUNNER_OS}|g" \
            -e "s|__APK_PATH__|${APK_PATH}|g" \
            -e "s|__APK_BYTES__|${APK_BYTES}|g" \
            -e "s|__APK_SHA256__|${APK_SHA256}|g" BUILD_REPORT.md

      - name: Upload APK, wrapper and test reports
        uses: actions/upload-artifact@v4
        with:
          name: Quantum-Alpha-0.1.1-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/reports/tests/testDebugUnitTest/
            gradlew
            gradlew.bat
            gradle/wrapper/gradle-wrapper.jar
            gradle/wrapper/gradle-wrapper.properties
            BUILD_REPORT.md
          if-no-files-found: error
          retention-days: 30
